<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wärmekurve von Wasser</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; 
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .experiment-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-wrap: wrap; 
            gap: 20px;
            width: 100%;
            max-width: 700px;
            justify-content: center;
        }
        .visual-area, .instruments {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1 1 250px; 
            max-width: 320px;
        }
        h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
        }
        
        /* Neues Digitalthermometer Gerät */
        .digital-sensor {
            background: #2c3e50;
            border-radius: 8px;
            padding: 12px 15px;
            border: 2px solid #1a252f;
            color: #ff4757; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 28px;
            font-weight: bold;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 6px rgba(0,0,0,0.2);
            width: 140px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        .sensor-wire {
            width: 5px;
            height: 25px;
            background: #333;
            z-index: 1;
        }

        /* Becherglas & Aufbau */
        .beaker {
            width: 120px;
            height: 150px;
            border: 3px solid #b0c4de;
            border-top: none;
            border-radius: 0 0 12px 12px;
            position: relative;
            background: rgba(255, 255, 255, 0.5);
            overflow: hidden;
        }
        .probe {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 120px;
            background: linear-gradient(to right, #999, #eee, #999);
            border-radius: 4px;
            z-index: 5;
        }
        .water {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            background: rgba(65, 131, 215, 0.5);
            transition: background 1s;
        }
        .ice-cube {
            width: 22px;
            height: 22px;
            background: rgba(255,255,255, 0.85);
            border: 1px solid #add8e6;
            position: absolute;
            border-radius: 3px;
            z-index: 2;
        }
        /* 6 Eiswürfel */
        .ice-1 { bottom: 5px; left: 10px; transform: rotate(15deg); }
        .ice-2 { bottom: 10px; right: 10px; transform: rotate(-10deg); }
        .ice-3 { bottom: 25px; left: 35px; transform: rotate(5deg); }
        .ice-4 { bottom: 35px; right: 20px; transform: rotate(25deg); }
        .ice-5 { bottom: 5px; left: 45px; transform: rotate(-20deg); }
        .ice-6 { bottom: 45px; left: 15px; transform: rotate(-5deg); }
        
        .bubble {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            position: absolute;
            bottom: -10px;
            opacity: 0;
        }
        .steam {
            width: 40px;
            height: 40px;
            background: rgba(200, 200, 200, 0.4);
            border-radius: 50%;
            position: absolute;
            top: -15px;
            left: 40px;
            opacity: 0;
            filter: blur(5px);
        }
        .burner {
            margin-top: 5px;
            font-size: 32px;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .burner.active {
            opacity: 1;
            animation: flicker 0.5s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }

        /* Uhr und Steuerung */
        .clock {
            font-size: 32px;
            font-family: monospace;
            background: #222;
            color: #0f0;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            background: #4183d7;
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background 0.2s;
            touch-action: manipulation;
        }
        button:hover { background: #2c63a6; }
        button.active { background: #e67e22; }
        
        .instruction-text {
            font-size: 13px;
            color: #555;
            text-align: center;
            margin-top: 20px;
            line-height: 1.4;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="experiment-container">
    <div class="visual-area">
        <h3>Versuchsaufbau</h3>
        
        <!-- Neues Digitalthermometer + Sensor -->
        <div class="digital-sensor" id="temp-display">0.0 °C</div>
        <div class="sensor-wire"></div>

        <div class="beaker">
            <div class="probe"></div> <!-- Der Temperaturfühler im Wasser -->
            <div class="steam" id="steam"></div>
            <div class="water" id="water">
                <div class="ice-cube ice-1" id="ice1"></div>
                <div class="ice-cube ice-2" id="ice2"></div>
                <div class="ice-cube ice-3" id="ice3"></div>
                <div class="ice-cube ice-4" id="ice4"></div>
                <div class="ice-cube ice-5" id="ice5"></div>
                <div class="ice-cube ice-6" id="ice6"></div>
                
                <div class="bubble" id="b1" style="left: 20%;"></div>
                <div class="bubble" id="b2" style="left: 50%;"></div>
                <div class="bubble" id="b3" style="left: 80%;"></div>
            </div>
        </div>
        <div class="burner" id="burner">🔥</div>
    </div>

    <div class="instruments">
        <h3>Stoppuhr</h3>
        <div class="clock" id="clock">00:00</div>
        
        <div class="controls">
            <button id="btnStart" onclick="startSim()">Start</button>
            <button id="btnPause" onclick="pauseSim()">Pause</button>
            <button id="btnReset" onclick="resetSim()">Neustart</button>
            <button id="btnSpeed" onclick="toggleSpeed()">Zeitraffer (x1)</button>
        </div>
        <p class="instruction-text">
            <strong>Auftrag:</strong><br> Lies jede Minute die Temperatur auf dem Sensor ab und trage sie in deine Tabelle ein!
        </p>
    </div>
</div>

<script>
    let timeInSeconds = 0;
    let isRunning = false;
    let speed = 1; 
    let lastTime = 0;
    let reqFrame;
    
    let lastTempUpdate = -1; // Merkt sich, wann die Temperatur zuletzt geupdatet wurde

    const T_MELT_END = 180;    // Min 0 bis 3: Schmelzplateau
    const T_BOIL_START = 480;  // Min 3 bis 8: Erhitzen
    const T_END = 600;         // Min 8 bis 10: Siedeplateau

    function getBaseTemperature(t) {
        if (t <= T_MELT_END) {
            return 0.0; 
        } else if (t > T_MELT_END && t < T_BOIL_START) {
            let progress = (t - T_MELT_END) / (T_BOIL_START - T_MELT_END);
            return (100 * progress);
        } else {
            return 100.0; 
        }
    }

    function loop() {
        if (!isRunning) return;
        
        let now = Date.now();
        let dt = (now - lastTime) / 1000;
        lastTime = now;
        timeInSeconds += dt * speed;
        
        if (timeInSeconds >= T_END) {
            timeInSeconds = T_END;
            isRunning = false;
            document.getElementById('burner').classList.remove('active');
        }

        updateUI();
        if (isRunning) reqFrame = requestAnimationFrame(loop);
    }

    function updateUI() {
        // Uhrzeit updaten
        let mins = Math.floor(timeInSeconds / 60);
        let secs = Math.floor(timeInSeconds % 60);
        document.getElementById('clock').innerText = 
            (mins < 10 ? "0" + mins : mins) + ":" + (secs < 10 ? "0" + secs : secs);

        // --- Realistische Temperatur-Anzeige (Aktualisiert nur alle 2,5 Sekunden) ---
        if (timeInSeconds === 0) {
            document.getElementById('temp-display').innerText = "0.0 °C";
            lastTempUpdate = 0;
        } 
        else if (timeInSeconds - lastTempUpdate >= 2.5 || timeInSeconds >= T_END) {
            let base = getBaseTemperature(timeInSeconds);
            // Simuliert einen Messfehler zwischen -0.4 und +0.4 Grad
            let noise = (Math.random() - 0.5) * 0.8; 
            
            let temp = base + noise;
            
            document.getElementById('temp-display').innerText = temp.toFixed(1) + " °C";
            lastTempUpdate = timeInSeconds;
        }

        // --- Animationen (Eis schmelzen) ---
        let iceOpacity = 1;
        if (timeInSeconds > 0) iceOpacity = 1 - (timeInSeconds / T_MELT_END);
        if (timeInSeconds >= T_MELT_END) iceOpacity = 0;
        
        for(let i=1; i<=6; i++) {
            document.getElementById('ice'+i).style.opacity = iceOpacity;
        }

        // Kochen & Blasen & Dampf
        let b1 = document.getElementById('b1'), b2 = document.getElementById('b2'), b3 = document.getElementById('b3');
        let steam = document.getElementById('steam');
        let currentTemp = getBaseTemperature(timeInSeconds); // Für Animation echtes Level nutzen

        if (currentTemp >= 95) {
            let b1Pos = (timeInSeconds * 50) % 100, b2Pos = (timeInSeconds * 70 + 20) % 100, b3Pos = (timeInSeconds * 60 + 50) % 100;
            b1.style.bottom = b1Pos + "%"; b1.style.opacity = (currentTemp>98)? 1 : 0.5;
            b2.style.bottom = b2Pos + "%"; b2.style.opacity = (currentTemp>98)? 1 : 0.5;
            b3.style.bottom = b3Pos + "%"; b3.style.opacity = (currentTemp>98)? 1 : 0.5;
            steam.style.opacity = 0.7 + Math.sin(timeInSeconds*2)*0.2;
            steam.style.top = (-15 - (timeInSeconds*10 % 30)) + "px";
        } else {
            b1.style.opacity = 0; b2.style.opacity = 0; b3.style.opacity = 0;
            steam.style.opacity = 0;
        }
    }

    function startSim() {
        if (!isRunning && timeInSeconds < T_END) {
            isRunning = true;
            lastTime = Date.now();
            document.getElementById('burner').classList.add('active');
            loop();
        }
    }

    function pauseSim() {
        isRunning = false;
        document.getElementById('burner').classList.remove('active');
    }

    function resetSim() {
        isRunning = false;
        timeInSeconds = 0;
        lastTempUpdate = -1;
        document.getElementById('burner').classList.remove('active');
        updateUI();
    }

    function toggleSpeed() {
        let btn = document.getElementById('btnSpeed');
        if (speed === 1) {
            speed = 10;
            btn.innerText = "Zeitraffer (x10)";
            btn.classList.add('active');
        } else {
            speed = 1;
            btn.innerText = "Zeitraffer (x1)";
            btn.classList.remove('active');
        }
    }

    updateUI();
</script>
</body>
</html>
